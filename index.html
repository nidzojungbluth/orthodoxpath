/* =========================================================
   OrthodoxPath – Designsystem 2.4
   Tiefes Schwarz, Anthrazit, Gold, cremefarbene Schrift.
   ========================================================= */
:root {
  --fs: 1;
  --bg: #0a0a0b;
  --bg2: #101012;
  --card: #151517;
  --card2: #1c1c1f;
  --line: #27272b;
  --hair: rgba(255, 255, 255, .065);
  --text: #f2ebdc;
  --muted: #9e9789;
  --gold: #c6a15b;
  --gold2: #e2c68e;
  --goldsoft: rgba(198, 161, 91, .12);
  --onGold: #17120a;
  --red: #9a3440;
  --green: #6f9a68;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --radius: 18px;
  --r-sm: 12px;
  --serif: "OP Serif", "Cormorant Garamond", "Iowan Old Style", "Palatino", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
html[data-theme="light"] {
  --bg: #f5f0e6;
  --bg2: #efe8da;
  --card: #fffdf8;
  --card2: #f6efe1;
  --line: #e3d8c4;
  --hair: rgba(60, 40, 10, .09);
  --text: #231c14;
  --muted: #5f5341;
  --gold: #7f5f1c;
  --gold2: #6c5018;
  --goldsoft: rgba(148, 112, 42, .10);
  --onGold: #fffaf0;
  --shadow: 0 6px 20px rgba(60, 40, 10, .08);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: var(--sans);
  font-size: calc(17px * var(--fs));
  line-height: 1.58;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
  overscroll-behavior-y: none;
}
h1, h2, h3, .big, .stat b, .flash .face .main, .creed, .medal { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; margin: 0 0 .45em; letter-spacing: .002em; }
h1 { font-size: 2.15em; }
h2 { font-size: 1.6em; color: var(--gold2); }
h3 { font-size: 1.32em; }
p { margin: 0 0 .85em; }
a { color: var(--gold2); text-decoration-thickness: 1px; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
b, strong { font-weight: 650; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 18px; padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }

/* Symbole */
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.2em; }
.ic.gold { color: var(--gold); }
.ic.flip { transform: scaleX(-1); }
.okline { display: flex; align-items: center; gap: 8px; }

/* Kopfzeile */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(150%) blur(18px); -webkit-backdrop-filter: saturate(150%) blur(18px);
  border-bottom: 1px solid var(--hair);
  padding-top: env(safe-area-inset-top);
}
.top .wrap { display: flex; align-items: center; gap: 10px; height: 54px; }
.top .brand { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-size: 1.35em; font-weight: 600; color: var(--gold2); text-decoration: none; flex: 1; min-width: 0; letter-spacing: .01em; }
.top .brand svg { flex: none; width: 18px; height: 24px; color: var(--gold); }
.iconbtn {
  min-width: 44px; height: 40px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 12px; cursor: pointer; font-size: .8em; font-weight: 650; letter-spacing: .02em; color: var(--text);
}
.iconbtn .ic { width: 17px; height: 17px; color: var(--gold); }
.backbtn { border: none; background: none; color: var(--gold2); padding: 0 6px 0 0; text-decoration: none; font-size: .95em; font-weight: 500; gap: 2px; min-width: 0; }
.backbtn .ic { width: 22px; height: 22px; color: var(--gold2); }

/* Untere Navigation */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  background: color-mix(in srgb, var(--bg2) 82%, transparent);
  backdrop-filter: saturate(150%) blur(20px); -webkit-backdrop-filter: saturate(150%) blur(20px);
  border-top: 1px solid var(--hair);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs .wrap { display: flex; justify-content: space-between; padding: 0 max(4px, env(safe-area-inset-left)) 0 max(4px, env(safe-area-inset-right)); }
.tab {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 2px 7px; min-height: 58px; text-decoration: none; color: var(--muted);
  font-size: 10px; font-weight: 600; letter-spacing: 0; border: none; background: none; cursor: pointer; position: relative;
}
.tab svg { width: 24px; height: 24px; stroke-width: 1.6; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab.active { color: var(--gold2); }
.tab.active::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; border-radius: 2px; background: var(--gold); }

main { padding: 20px 0 28px; }
.pagehead { margin: 4px 0 16px; }
.pagehead h1 { margin: 2px 0 0; }

/* Karten */
.card {
  background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius);
  padding: 18px; margin: 0 0 14px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
}
html[data-theme="light"] .card { box-shadow: var(--shadow); }
.card.hero {
  position: relative; overflow: hidden;
  border-color: color-mix(in srgb, var(--gold) 38%, transparent);
  background: radial-gradient(120% 90% at 100% 0%, var(--goldsoft), transparent 60%), var(--card);
  padding: 20px;
}
.card.hero .herotitle { font-size: 1.75em; color: var(--text); margin-bottom: .2em; }
.card.hero .btn { margin-top: 6px; }
.muted { color: var(--muted); }
.small { font-size: .86em; }
.center { text-align: center; }
.gold { color: var(--gold); }
.big { font-family: var(--serif); font-size: 1.6em; color: var(--gold2); font-weight: 600; }
.eyebrow { font-size: .72em; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
.sh { font-size: .72em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 24px 4px 9px; }
.row { display: flex; gap: 10px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { text-align: center; padding: 16px 8px; }
.stat b { display: block; font-size: 1.9em; font-family: var(--serif); color: var(--gold2); font-weight: 600; }

/* Schnellzugriff */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 14px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  padding: 14px 4px 12px; min-height: 86px; border-radius: 16px; background: var(--card); border: 1px solid var(--hair);
  text-decoration: none; color: var(--text); text-align: center;
}
.tile .ico { width: 38px; height: 38px; border-radius: 12px; background: var(--goldsoft); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; }
.tile .ico .ic { width: 21px; height: 21px; }
.tile .tl { font-size: .74em; font-weight: 600; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tile .pill { position: absolute; top: 8px; right: 8px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--gold); color: var(--onGold); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

/* Schaltflächen */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 20px; border-radius: 14px; border: 1px solid var(--gold);
  background: var(--gold); color: var(--onGold); font-weight: 650; letter-spacing: .01em; text-decoration: none; cursor: pointer;
}
.btn .ic { width: 19px; height: 19px; }
.btn.ghost { background: transparent; color: var(--gold2); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.btn.block { width: 100%; }
.btn.danger { background: transparent; border-color: var(--red); color: #e48a94; }
html[data-theme="light"] .btn.danger { color: var(--red); }
.btn:disabled { opacity: .45; }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

/* Listen – gruppiert im iOS-Stil */
.list { list-style: none; margin: 0 0 14px; padding: 0; }
.item {
  display: flex; align-items: center; gap: 13px; padding: 13px 16px; min-height: 58px;
  background: var(--card); border: 1px solid var(--hair); border-radius: 16px; margin-bottom: 10px;
  text-decoration: none; color: var(--text); cursor: pointer; width: 100%; text-align: left; position: relative;
}
.list { background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius); overflow: hidden; }
html[data-theme="light"] .list { box-shadow: var(--shadow); }
.list > li > .item { border: none; border-radius: 0; margin: 0; background: transparent; }
.list > li + li > .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--hair); }
.list > li + li > .item:has(.ico, .medal, .check)::before { left: 64px; }
.list > li.item { border: none; border-radius: 0; margin: 0; background: transparent; }
.list > li + li.item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--hair); }
.list > li.refline { padding: 12px 16px; }
.card .list { background: transparent; border: none; border-radius: 0; box-shadow: none; margin-bottom: 0; }
.card .list > li > .item, .card .list > li.item { padding-left: 0; padding-right: 0; }
.card .list > li + li > .item::before, .card .list > li + li.item::before { left: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-weight: 600; display: block; line-height: 1.3; }
.item .s { font-size: .84em; color: var(--muted); display: block; margin-top: 2px; line-height: 1.4; }
.item .ico { width: 34px; height: 34px; border-radius: 10px; background: var(--goldsoft); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.item .ico .ic { width: 19px; height: 19px; }
.chev { color: var(--muted); flex: none; display: inline-flex; opacity: .7; }
.chev .ic { width: 17px; height: 17px; }
.medal {
  width: 36px; height: 36px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-weight: 700; font-size: 1.15em; color: var(--gold2);
  border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); background: var(--goldsoft);
}
.check { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 650; color: var(--muted); }
.check .ic { width: 16px; height: 16px; stroke-width: 2.2; }
.check.on { background: var(--gold); border-color: var(--gold); color: var(--onGold); }
.item.disabled { opacity: .5; cursor: default; }

/* Kennzeichnungen */
.badge { display: inline-flex; align-items: center; font-size: .7em; font-weight: 650; letter-spacing: .02em; padding: 3px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, currentColor 45%, transparent); background: color-mix(in srgb, currentColor 10%, transparent); margin: 0 4px 6px 0; vertical-align: middle; }
.tag-dogma { color: #d8b468; }
.tag-history { color: #8eaed0; }
.tag-opinion { color: #bba3dc; }
.tag-counsel { color: #8cbf87; }
.tag-uncertain { color: #e3967a; }
html[data-theme="light"] .tag-dogma { color: #765610; }
html[data-theme="light"] .tag-history { color: #285079; }
html[data-theme="light"] .tag-opinion { color: #5a3f86; }
html[data-theme="light"] .tag-counsel { color: #31652d; }
html[data-theme="light"] .tag-uncertain { color: #8e3f1e; }

/* Lektionen */
.sec { margin-bottom: 14px; }
.sec h3 { display: flex; align-items: center; gap: 10px; }
.sec h3 .num { font-family: var(--sans); font-size: .62em; font-weight: 700; min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; background: var(--goldsoft); color: var(--gold2); border-radius: 8px; padding: 0 6px; }
.simple { border-left: 2px solid var(--gold); padding-left: 14px; }
details { border-top: 1px solid var(--hair); margin-top: 12px; padding-top: 4px; }
summary { cursor: pointer; font-weight: 650; color: var(--gold2); min-height: 44px; display: flex; align-items: center; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 8px; height: 8px; margin: 0 12px 0 4px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(-45deg); transition: transform .2s var(--ease); flex: none; }
details[open] summary::before { transform: rotate(45deg); }
.refline { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
.refline:last-child { border-bottom: none; }
.refline b { white-space: nowrap; color: var(--gold2); font-weight: 600; }
.refline .grow { flex: 1; }
.star { border: none; background: none; min-width: 44px; min-height: 40px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.star .ic { width: 22px; height: 22px; }
.star.on { color: var(--gold); }

/* Formulare */
textarea, input[type=text], input[type=password], input[type=search] {
  width: 100%; font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 12px 14px; min-height: 48px; -webkit-appearance: none; appearance: none;
}
textarea:focus, input:focus { outline: none; border-color: color-mix(in srgb, var(--gold) 70%, transparent); box-shadow: 0 0 0 3px var(--goldsoft); }
textarea { min-height: 110px; resize: vertical; }
label { display: block; font-weight: 600; margin: 12px 0 6px; font-size: .92em; }
.qa { padding: 12px 0; border-bottom: 1px solid var(--hair); }
.qa:last-child { border-bottom: none; }
.answer { background: var(--card2); border-radius: var(--r-sm); padding: 11px 13px; margin-top: 8px; }

/* Quiz */
.opt { display: block; width: 100%; text-align: left; padding: 15px 16px; margin: 9px 0; min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--card2); cursor: pointer; transition: border-color .2s, background .2s; }
.opt.correct { border-color: var(--green); background: color-mix(in srgb, var(--green) 22%, var(--card2)); }
.opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 22%, var(--card2)); }
.progressbar { height: 6px; background: var(--card2); border-radius: 99px; overflow: hidden; }
.progressbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; transition: width .5s var(--ease); }

/* Lernkarten */
.flash { perspective: 1000px; margin: 10px 0 16px; }
.flash .inner { position: relative; min-height: 240px; transition: transform .5s var(--ease); transform-style: preserve-3d; cursor: pointer; }
.flash.flipped .inner { transform: rotateY(180deg); }
.flash .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 24px; border-radius: var(--radius); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); background: radial-gradient(120% 90% at 50% 0%, var(--goldsoft), transparent 65%), var(--card); }
.flash .face.back { transform: rotateY(180deg); }
.flash .face .q { font-size: .78em; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; font-weight: 700; }
.flash .face .main { font-family: var(--serif); font-size: 1.5em; line-height: 1.25; }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate button { min-height: 54px; border-radius: 13px; border: 1px solid var(--line); background: var(--card); font-weight: 650; font-size: .84em; cursor: pointer; }
.rate .r0 { border-color: color-mix(in srgb, var(--red) 70%, transparent); }
.rate .r3 { border-color: color-mix(in srgb, var(--green) 70%, transparent); }

/* Auswahl */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 15px; min-height: 40px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: .88em; font-weight: 550; }
.chip.on { background: var(--gold); color: var(--onGold); border-color: var(--gold); font-weight: 650; }
.seg { display: flex; gap: 3px; padding: 3px; background: var(--card2); border: 1px solid var(--hair); border-radius: 13px; }
.seg button { flex: 1; min-width: 0; min-height: 42px; padding: 4px 6px; border: none; border-radius: 10px; background: transparent; cursor: pointer; font-weight: 600; font-size: .86em; line-height: 1.15; color: var(--muted); transition: background .2s, color .2s; }
.seg button.on { background: var(--gold); color: var(--onGold); }

/* Dialoge */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: opBg .2s ease-out; }
.sheet { position: relative; width: 100%; max-width: 720px; background: var(--bg2); border-radius: 22px 22px 0 0; padding: 26px 18px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hair); max-height: 88vh; overflow: auto; animation: opUp .28s var(--ease); }
.sheet::before { content: ""; position: absolute; top: 9px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--card2); border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); color: var(--text); padding: 11px 18px; border-radius: 999px; z-index: 60; box-shadow: var(--shadow); max-width: 90vw; font-size: .92em; animation: opUp .25s var(--ease); }
.banner { background: color-mix(in srgb, var(--red) 22%, var(--card)); border: 1px solid color-mix(in srgb, var(--red) 70%, transparent); border-radius: var(--r-sm); padding: 11px 13px; margin-bottom: 12px; font-size: .9em; }

/* Ornamente */
.divider, .ornament { display: flex; align-items: center; gap: 14px; color: var(--gold); margin: 26px 0 16px; }
.divider::before, .divider::after, .ornament::before, .ornament::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--gold) 40%, transparent)); }
.divider::after, .ornament::after { background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 40%, transparent), transparent); }
.divider svg, .ornament svg { width: 14px; height: 19px; opacity: .85; }
.creed { font-family: var(--serif); font-size: 1.25em; line-height: 1.5; white-space: pre-line; }
.pre { white-space: pre-line; }

/* Begrüßung */
.onb { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding-top: calc(30px + env(safe-area-inset-top)); padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
.onb .logo { text-align: center; margin-bottom: 22px; color: var(--gold); }
.onb .logo h1 { color: var(--text); margin-top: 12px; }
.legend .badge { margin-bottom: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Wochenübersicht */
.weekdots { display: flex; justify-content: space-between; gap: 6px; margin-top: 10px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
.wd i { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: block; }
.wd.on i { background: var(--gold); border-color: var(--gold); }
.wd.today i { box-shadow: 0 0 0 3px var(--goldsoft); border-color: var(--gold); }
.wd small { font-size: .68em; color: var(--muted); font-weight: 600; }

/* Bewegung */
@keyframes opFade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@keyframes opUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.toast { animation-name: opToast; }
@keyframes opToast { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes opBg { from { opacity: 0; } to { opacity: 1; } }
main > .wrap { animation: opFade .3s var(--ease); }
.item, .tile, .btn, .opt, .chip { transition: background-color .15s, transform .15s var(--ease), border-color .2s; }
.item:active, .tile:active { background-color: var(--card2); }
.btn:active, .opt:active, .tile:active { transform: scale(.98); }
@media (hover: hover) { .item:hover, .tile:hover { background-color: var(--card2); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
@media (max-width: 360px) {
  body { font-size: calc(16px * var(--fs)); }
  .wrap { padding-left: 14px; padding-right: 14px; }
  .tiles { gap: 7px; }
  .tile .tl { font-size: .68em; }
  h1 { font-size: 1.95em; }
}

/* Ergebnisring */
.ring { --p: 0; width: 132px; height: 132px; margin: 6px auto 0; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--card2) 0); }
.ring span { width: 112px; height: 112px; border-radius: 50%; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring b { font-family: var(--serif); font-size: 2.4em; line-height: 1; color: var(--gold2); font-variant-numeric: lining-nums; }
.ring small { color: var(--muted); font-size: .8em; }

/* Glossar */
.glo { display: block; padding: 13px 16px; position: relative; }
.list > li.glo + li.glo::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--hair); }
.glo[hidden], .glgroup[hidden] { display: none; }
.glo .gt { display: block; font-family: var(--serif); font-size: 1.22em; font-weight: 600; color: var(--gold2); line-height: 1.25; }
.glo .gd { display: block; color: var(--text); font-size: .95em; margin-top: 3px; }

/* Schritt-Anleitung */
.steps { margin: 6px 0 12px; padding-left: 0; list-style: none; counter-reset: st; }
.steps li { counter-increment: st; position: relative; padding: 6px 0 6px 38px; font-size: .94em; }
.steps li::before { content: counter(st); position: absolute; left: 0; top: 5px; width: 26px; height: 26px; border-radius: 50%; background: var(--goldsoft); color: var(--gold2); font-weight: 700; font-size: .82em; display: flex; align-items: center; justify-content: center; }
/* Lektionsnavigation */
.lnav .item .s { margin: 0 0 2px; text-transform: uppercase; letter-spacing: .1em; font-size: .68em; font-weight: 700; color: var(--gold); }

.bookcard[hidden] { display: none; }

/* Hinweise auf der Startseite */
.card.notice { border-color: color-mix(in srgb, var(--gold) 40%, transparent); }
.card.notice h3 { font-size: 1.2em; }
label.btn { margin: 0; font-size: 1em; }

/* Monatsübersicht */
.month .mhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.month .mhead h3 { margin: 0; text-transform: capitalize; }
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.mw { text-align: center; font-size: .7em; font-weight: 700; color: var(--muted); padding: 2px 0 4px; text-transform: uppercase; }
.mc { position: relative; aspect-ratio: 1; min-height: 40px; border-radius: 10px; border: 1px solid transparent; background: var(--card2); font-size: .88em; font-weight: 600; cursor: pointer; color: var(--text); padding: 0; }
.mc.empty { background: transparent; cursor: default; }
.mc::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: transparent; }
.mc.fk-strict::after, .mlegend .fk-strict { background: #c0525e; }
.mc.fk-fast::after, .mlegend .fk-fast { background: #d79a4a; }
.mc.fk-light::after, .mlegend .fk-light { background: #c9b26a; }
.mc.fk-free::after, .mlegend .fk-free { background: #6f9a68; }
.mc.feast { border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.mc.great { border-color: var(--gold); background: var(--goldsoft); color: var(--gold2); }
.mc.today { box-shadow: 0 0 0 2px var(--gold) inset; }
.mc.sel { background: var(--gold); color: var(--onGold); }
.mlegend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: .75em; color: var(--muted); }
.mlegend span { display: inline-flex; align-items: center; gap: 5px; }
.mlegend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.mlegend .lg-great { border-radius: 3px; border: 1.5px solid var(--gold); background: var(--goldsoft); width: 10px; height: 10px; }
.mdetail { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }

/* Ikonenbilder (gemeinfrei, Wikimedia Commons) */
.iconimg { margin: 10px 0 12px; text-align: center; }
.iconimg img { display: block; margin: 0 auto; max-width: 100%; height: 300px; width: auto; object-fit: contain; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.iconimg img:not([data-ok]) { min-width: 200px; background: rgba(127,127,127,.12); box-shadow: none; }
.iconimg figcaption { margin-top: 6px; line-height: 1.35; }
.card.flash { animation: opflash 1.6s ease-out 1; }
@keyframes opflash { 0% { box-shadow: 0 0 0 2px var(--gold); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; outline: 2px solid var(--gold); } }
/* Sprungziele nicht unter der festen Kopfleiste verstecken */
section[id^="icon-"], h2[id^="ig-"] { scroll-margin-top: calc(72px + env(safe-area-inset-top)); }
.medal.photo { padding: 0; overflow: hidden; background: var(--card2, #1d1d20); }
.medal.photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; display: block; }

/* Ikonen-Galerie */
.galgrid { list-style: none; margin: 14px 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.galgrid li[hidden] { display: none; }
.galgrid a { display: block; text-decoration: none; color: inherit; }
.galgrid img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; background: rgba(127,127,127,.14); box-shadow: 0 3px 12px rgba(0,0,0,.35); }
.galgrid span { display: block; margin-top: 6px; font-size: 13px; line-height: 1.25; }
.chips button.chip[aria-pressed="true"] { background: var(--gold); color: var(--onGold); border-color: var(--gold); font-weight: 650; }
.galbig { margin: 8px 0 12px; text-align: center; }
.galbig img { display: block; margin: 0 auto; max-width: 100%; max-height: 72vh; width: auto; height: auto; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.4); touch-action: pan-y; }
.galbig figcaption { margin-top: 8px; }
.galnav { display: flex; gap: 10px; margin-bottom: 12px; }
.galnav .btn { flex: 1; text-align: center; }
